name: social-media-moderation-performance

services:
  gateway:
    environment:
      AI_WORK_IDEMPOTENCY_ALLOW_UNAUTHENTICATED: "true"
      AI_WORK_IDEMPOTENCY_INTERNAL_TOKEN: ""
      OPENAI_MODERATION_PROFILE_SHA256: 359e703e3405ed2f32872265e12cfbf7ffd055a4f6141cf748943df2400a8759
      OPENAI_CLASSIFICATION_PROFILE_SHA256: 4b0a68cf80f2de5418f0adcc8d4c5cc3e4674dbcd2c66e48c6af9ff4d580dbfc
      OPENAI_ADJUDICATION_PROFILE_SHA256: b555a40b314bfae55729a53761a25390bbcbddb72d1594cebb3dc1a50fc3333c
      OPENAI_IMAGE_ADJUDICATION_PROFILE_SHA256: 04f084ec05acb9c1b121820b7ff3aabe34867181bba480b3e245d708fd5c8aa2

  media-service:
    environment:
      AI_WORK_IDEMPOTENCY_ALLOW_UNAUTHENTICATED: "true"
      AI_WORK_IDEMPOTENCY_INTERNAL_TOKEN: ""
      VISUAL_RETRIEVAL_ALLOW_UNAUTHENTICATED: "true"
      VISUAL_RETRIEVAL_INTERNAL_TOKEN: ""

  visual-retrieval:
    environment:
      VISUAL_RETRIEVAL_ALLOW_UNAUTHENTICATED: "true"
      VISUAL_RETRIEVAL_INTERNAL_TOKEN: ""

  ai-service:
    environment:
      OPENAI_API_KEY: fake-load-test-key
      OPENAI_BASE_URL: http://fake-openai:8000/v1
    depends_on:
      fake-openai:
        condition: service_healthy

volumes:
  moderation-db-data:
    name: social-media-moderation-performance-db
  moderation-prometheus-data:
    name: social-media-moderation-performance-prometheus
