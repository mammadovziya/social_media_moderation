server:
  port: 8000
  shutdown: graceful

spring:
  application:
    name: moderation-gateway
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_BYTES:8388608}
      max-request-size: ${MAX_IMAGE_REQUEST_BYTES:9437184}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha

moderation:
  max-image-bytes: ${MAX_IMAGE_BYTES:8388608}
  max-image-width: ${MAX_IMAGE_WIDTH:8192}
  max-image-height: ${MAX_IMAGE_HEIGHT:8192}
  max-image-pixels: ${MAX_IMAGE_PIXELS:40000000}
  exact-sha256-references-path: ${EXACT_SHA256_REFERENCES_PATH:file:./config/exact_sha256_references.txt}
  moderation-terms-path: ${MODERATION_TERMS_PATH:file:./config/moderation_terms.txt}
  policy-version: ${MODERATION_POLICY_VERSION:minimal-sha-ai-v1}

openai:
  enabled: ${OPENAI_ENABLED:false}
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:60}
  terra-reasoning-effort: ${OPENAI_TERRA_REASONING_EFFORT:medium}
  max-concurrent-requests: ${OPENAI_MAX_CONCURRENT_REQUESTS:4}
