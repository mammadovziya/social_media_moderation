server:
  port: 8000
  shutdown: graceful

spring:
  application:
    name: moderation-gateway
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_BYTES:8388608}
      max-request-size: ${MAX_IMAGE_REQUEST_BYTES:9437184}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha

moderation:
  ai-service-url: ${AI_SERVICE_URL:http://ai-service:8000}
  media-service-url: ${MEDIA_SERVICE_URL:http://media-service:8000}
  max-image-bytes: ${MAX_IMAGE_BYTES:8388608}
  max-image-request-bytes: ${MAX_IMAGE_REQUEST_BYTES:9437184}
  upstream-timeout-seconds: ${UPSTREAM_TIMEOUT_SECONDS:45}
  unknown-threshold: ${MODERATION_UNKNOWN_THRESHOLD:0.70}
  expected-moderation-model: ${OPENAI_MODERATION_MODEL:omni-moderation-latest}
  expected-moderation-profile-sha256: ${OPENAI_MODERATION_PROFILE_SHA256:0e9e994cef268f7a1437292c34b9b53a932ba64fc1c5e49f8eb1a9336a73f0fa}
  expected-classification-model: ${OPENAI_CUSTOM_MODEL:gpt-4o-mini}
  expected-classification-prompt-bundle-sha256: ${OPENAI_CLASSIFICATION_PROMPT_BUNDLE_SHA256:5e37962e75241d4a185036c8ffd53ca0434d5a4870a0f7427664193f1c918277}
  expected-classification-profile-sha256: ${OPENAI_CLASSIFICATION_PROFILE_SHA256:1443b6f20571589552613830416506dfc870bcb581b1f4998da181f48832f2fc}
  expected-adjudication-model: ${OPENAI_ADJUDICATION_MODEL:gpt-5.6-terra}
  expected-adjudication-reasoning-effort: ${OPENAI_ADJUDICATION_REASONING_EFFORT:medium}
  expected-adjudication-prompt-version: image-adjudication-v2
  expected-adjudication-prompt-sha256: ${OPENAI_ADJUDICATION_PROMPT_SHA256:b066ec4efc4af83b6a477f3ca496ccddc716bfe84ffd4a6f5ff523a5468f6f29}
  expected-adjudication-profile-sha256: ${OPENAI_ADJUDICATION_PROFILE_SHA256:06fcc036b886a71c2fd2ceae32bbbade6fa8cd0fd964cd29868073c0c6a91f81}
  expected-open-ai-timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:30}
  moderation-terms-path: ${MODERATION_TERMS_PATH:file:./config/moderation_terms.txt}
  political-words-path: ${POLITICAL_WORDS_PATH:classpath:policy/political_words.txt}
