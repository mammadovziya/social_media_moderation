server:
  port: 8000
  shutdown: graceful

spring:
  application:
    name: moderation-gateway
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_BYTES:8388608}
      max-request-size: ${MAX_IMAGE_REQUEST_BYTES:9437184}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha

gateway:
  transport:
    max-connections: ${GATEWAY_HTTP_MAX_CONNECTIONS:128}
    max-connections-per-route: ${GATEWAY_HTTP_MAX_CONNECTIONS_PER_ROUTE:64}
    connection-request-timeout-ms: ${GATEWAY_HTTP_CONNECTION_REQUEST_TIMEOUT_MS:1000}
    connect-timeout-ms: ${GATEWAY_HTTP_CONNECT_TIMEOUT_MS:3000}
    keep-alive-seconds: ${GATEWAY_HTTP_KEEP_ALIVE_SECONDS:30}
    idle-connection-evict-seconds: ${GATEWAY_HTTP_IDLE_CONNECTION_EVICT_SECONDS:30}

moderation:
  ai-service-url: ${AI_SERVICE_URL:http://ai-service:8000}
  media-service-url: ${MEDIA_SERVICE_URL:http://media-service:8000}
  max-image-bytes: ${MAX_IMAGE_BYTES:8388608}
  max-image-request-bytes: ${MAX_IMAGE_REQUEST_BYTES:9437184}
  upstream-timeout-seconds: ${UPSTREAM_TIMEOUT_SECONDS:45}
  finalization-reserve-ms: ${MODERATION_FINALIZATION_RESERVE_MS:3000}
  policy-reload-interval-ms: ${POLICY_RELOAD_INTERVAL_MS:250}
  moderation-score-block-threshold: ${MODERATION_SCORE_BLOCK_THRESHOLD:0.15}
  expected-moderation-model: ${OPENAI_MODERATION_MODEL:omni-moderation-2024-09-26}
  expected-moderation-profile-sha256: ${OPENAI_MODERATION_PROFILE_SHA256:25183eb597e1e23190618d13153a1a47edc851efc7d2c55b287d2bbe8d7c1073}
  expected-classification-model: ${OPENAI_CUSTOM_MODEL:gpt-5.4-mini}
  expected-classification-prompt-bundle-sha256: ${OPENAI_CLASSIFICATION_PROMPT_BUNDLE_SHA256:3f16da31ae1f71763b2a5262e694b531abefddb1d626f4dbf731bcef56139928}
  expected-classification-profile-sha256: ${OPENAI_CLASSIFICATION_PROFILE_SHA256:8ba145c16b484d910a58755598552bf97107880b1dfef0a01d0825f941818b01}
  expected-adjudication-model: ${OPENAI_ADJUDICATION_MODEL:gpt-5.6-terra}
  expected-adjudication-reasoning-effort: ${OPENAI_ADJUDICATION_REASONING_EFFORT:medium}
  expected-adjudication-prompt-version: adjudication-prompts-v4
  expected-adjudication-prompt-sha256: ${OPENAI_ADJUDICATION_PROMPT_SHA256:ac1640fbf75889a8071545ae80fca3adf25706f6b9f3e7b35a60201aa2d82d1c}
  expected-adjudication-profile-sha256: ${OPENAI_ADJUDICATION_PROFILE_SHA256:c2855ff1698d969d213445a2e278557d8c2d8119a8d3ce5f01bf6d397f5f889e}
  expected-image-adjudication-prompt-sha256: ${OPENAI_IMAGE_ADJUDICATION_PROMPT_SHA256:14d2daa25d8b31765be1b804c061ab1bfab761a1a854f379e2d331ae82f93132}
  expected-image-adjudication-profile-sha256: ${OPENAI_IMAGE_ADJUDICATION_PROFILE_SHA256:894d8c98443230496195e0e443b3293e0f4ec359b9a582f20d87dbb58f9fb699}
  expected-open-ai-timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:30}
  blocked-terms-file: ${BLOCKED_TERMS_FILE:${user.dir}/config/blocked_terms.txt}
  restricted-political-entities-file: ${RESTRICTED_POLITICAL_ENTITIES_FILE:${user.dir}/config/restricted_political_entities.txt}
  internal-response-token: ${MODERATION_INTERNAL_RESPONSE_TOKEN:}

ai-work-idempotency:
  security:
    internal-token: ${AI_WORK_IDEMPOTENCY_INTERNAL_TOKEN:}
    allow-unauthenticated: ${AI_WORK_IDEMPOTENCY_ALLOW_UNAUTHENTICATED:false}

blocked-terms-policy:
  source-mode: ${BLOCKED_TERMS_SOURCE_MODE:file}
  refresh-interval-ms: ${BLOCKED_TERMS_REFRESH_INTERVAL_MS:30000}
  fetch-timeout-ms: ${BLOCKED_TERMS_FETCH_TIMEOUT_MS:2000}
  max-stale-seconds: ${BLOCKED_TERMS_MAX_STALE_SECONDS:900}

policy-distribution:
  security:
    internal-token: ${POLICY_DISTRIBUTION_INTERNAL_TOKEN:}
    allow-unauthenticated: ${POLICY_DISTRIBUTION_ALLOW_UNAUTHENTICATED:false}
    allow-insecure-http: ${POLICY_DISTRIBUTION_ALLOW_INSECURE_HTTP:false}
