server:
  port: 8000
  shutdown: graceful

spring:
  application:
    name: moderation-gateway
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_BYTES:10485760}
      max-request-size: ${MAX_IMAGE_BYTES:10485760}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha

moderation:
  ai-service-url: ${AI_SERVICE_URL:http://ai-service:8000}
  media-service-url: ${MEDIA_SERVICE_URL:http://media-service:8000}
  max-image-bytes: ${MAX_IMAGE_BYTES:10485760}
  upstream-timeout-seconds: ${UPSTREAM_TIMEOUT_SECONDS:30}
  unknown-threshold: ${MODERATION_UNKNOWN_THRESHOLD:0.70}
  moderation-terms-path: ${MODERATION_TERMS_PATH:file:./config/moderation_terms.txt}
  political-words-path: ${POLITICAL_WORDS_PATH:classpath:policy/political_words.txt}
