server:
  port: 8000
  shutdown: graceful

spring:
  application:
    name: moderation-ai-analyzer
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_BYTES:8388608}
      max-request-size: ${MAX_IMAGE_REQUEST_BYTES:9437184}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

ai:
  max-image-bytes: ${MAX_IMAGE_BYTES:8388608}
  max-image-request-bytes: ${MAX_IMAGE_REQUEST_BYTES:9437184}

openai:
  api-key: ${OPENAI_API_KEY:}
  moderation-model: ${OPENAI_MODERATION_MODEL:omni-moderation-2024-09-26}
  custom-model: ${OPENAI_CUSTOM_MODEL:gpt-5.4-mini}
  adjudication-model: ${OPENAI_ADJUDICATION_MODEL:gpt-5.6-terra}
  adjudication-reasoning-effort: ${OPENAI_ADJUDICATION_REASONING_EFFORT:medium}
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:30}
  transport:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    service-tier: ${OPENAI_SERVICE_TIER:default}
    classification-image-detail: ${OPENAI_CLASSIFICATION_IMAGE_DETAIL:high}
    adjudication-image-detail: ${OPENAI_ADJUDICATION_IMAGE_DETAIL:original}
    prompt-cache-key-enabled: ${OPENAI_PROMPT_CACHE_KEY_ENABLED:true}
    max-connections: ${OPENAI_MAX_CONNECTIONS:32}
    max-connections-per-route: ${OPENAI_MAX_CONNECTIONS_PER_ROUTE:32}
    connection-request-timeout-millis: ${OPENAI_CONNECTION_REQUEST_TIMEOUT_MILLIS:500}
    idle-connection-evict-seconds: ${OPENAI_IDLE_CONNECTION_EVICT_SECONDS:30}
    max-concurrent-requests: ${OPENAI_MAX_CONCURRENT_REQUESTS:32}
    max-concurrent-requests-per-model: ${OPENAI_MAX_CONCURRENT_REQUESTS_PER_MODEL:16}
    max-queued-requests: ${OPENAI_MAX_QUEUED_REQUESTS:64}
    admission-timeout-millis: ${OPENAI_ADMISSION_TIMEOUT_MILLIS:250}
