server:
  port: 8000
  shutdown: graceful

spring:
  application:
    name: moderation-ai-analyzer
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_BYTES:10485760}
      max-request-size: ${MAX_IMAGE_BYTES:10485760}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ai:
  max-image-bytes: ${MAX_IMAGE_BYTES:10485760}

openai:
  api-key: ${OPENAI_API_KEY:}
  moderation-model: ${OPENAI_MODERATION_MODEL:omni-moderation-latest}
  custom-model: ${OPENAI_CUSTOM_MODEL:gpt-4o-mini}
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:30}
