[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moderation-visual-retrieval"
version = "1.1.0"
description = "Internal, candidate-only ORB visual retrieval service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "pillow==11.3.0",
  "pydantic==2.11.7",
  "python-multipart==0.0.20",
  "uvicorn==0.35.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
