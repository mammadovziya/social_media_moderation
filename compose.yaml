name: social-media-moderation

services:
  moderation-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moderation}
      POSTGRES_USER: ${POSTGRES_USER:-moderation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moderation-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - moderation-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    cpus: "${POSTGRES_CPUS:-1.0}"
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-1g}"
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      AI_SERVICE_URL: http://ai-service:8000
      MEDIA_SERVICE_URL: http://media-service:8000
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-8388608}
      MAX_IMAGE_REQUEST_BYTES: ${MAX_IMAGE_REQUEST_BYTES:-9437184}
      MODERATION_SCORE_BLOCK_THRESHOLD: ${MODERATION_SCORE_BLOCK_THRESHOLD:-0.15}
      OPENAI_MODERATION_MODEL: ${OPENAI_MODERATION_MODEL:-omni-moderation-2024-09-26}
      OPENAI_MODERATION_PROFILE_SHA256: ${OPENAI_MODERATION_PROFILE_SHA256:-25183eb597e1e23190618d13153a1a47edc851efc7d2c55b287d2bbe8d7c1073}
      OPENAI_CUSTOM_MODEL: ${OPENAI_CUSTOM_MODEL:-gpt-5.4-mini}
      OPENAI_CLASSIFICATION_PROMPT_BUNDLE_SHA256: ${OPENAI_CLASSIFICATION_PROMPT_BUNDLE_SHA256:-3f16da31ae1f71763b2a5262e694b531abefddb1d626f4dbf731bcef56139928}
      OPENAI_CLASSIFICATION_PROFILE_SHA256: ${OPENAI_CLASSIFICATION_PROFILE_SHA256:-8ba145c16b484d910a58755598552bf97107880b1dfef0a01d0825f941818b01}
      OPENAI_ADJUDICATION_MODEL: ${OPENAI_ADJUDICATION_MODEL:-gpt-5.6-terra}
      OPENAI_ADJUDICATION_REASONING_EFFORT: ${OPENAI_ADJUDICATION_REASONING_EFFORT:-medium}
      OPENAI_ADJUDICATION_PROMPT_SHA256: ${OPENAI_ADJUDICATION_PROMPT_SHA256:-ac1640fbf75889a8071545ae80fca3adf25706f6b9f3e7b35a60201aa2d82d1c}
      OPENAI_ADJUDICATION_PROFILE_SHA256: ${OPENAI_ADJUDICATION_PROFILE_SHA256:-c2855ff1698d969d213445a2e278557d8c2d8119a8d3ce5f01bf6d397f5f889e}
      OPENAI_IMAGE_ADJUDICATION_PROMPT_SHA256: ${OPENAI_IMAGE_ADJUDICATION_PROMPT_SHA256:-14d2daa25d8b31765be1b804c061ab1bfab761a1a854f379e2d331ae82f93132}
      OPENAI_IMAGE_ADJUDICATION_PROFILE_SHA256: ${OPENAI_IMAGE_ADJUDICATION_PROFILE_SHA256:-894d8c98443230496195e0e443b3293e0f4ec359b9a582f20d87dbb58f9fb699}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-45}
      MODERATION_FINALIZATION_RESERVE_MS: ${MODERATION_FINALIZATION_RESERVE_MS:-3000}
      GATEWAY_HTTP_MAX_CONNECTIONS: ${GATEWAY_HTTP_MAX_CONNECTIONS:-128}
      GATEWAY_HTTP_MAX_CONNECTIONS_PER_ROUTE: ${GATEWAY_HTTP_MAX_CONNECTIONS_PER_ROUTE:-64}
      GATEWAY_HTTP_CONNECTION_REQUEST_TIMEOUT_MS: ${GATEWAY_HTTP_CONNECTION_REQUEST_TIMEOUT_MS:-1000}
      GATEWAY_HTTP_CONNECT_TIMEOUT_MS: ${GATEWAY_HTTP_CONNECT_TIMEOUT_MS:-3000}
      GATEWAY_HTTP_KEEP_ALIVE_SECONDS: ${GATEWAY_HTTP_KEEP_ALIVE_SECONDS:-30}
      GATEWAY_HTTP_IDLE_CONNECTION_EVICT_SECONDS: ${GATEWAY_HTTP_IDLE_CONNECTION_EVICT_SECONDS:-30}
      BLOCKED_TERMS_FILE: /app/config/blocked_terms.txt
      BLOCKED_TERMS_SOURCE_MODE: ${BLOCKED_TERMS_SOURCE_MODE:-file}
      BLOCKED_TERMS_REFRESH_INTERVAL_MS: ${BLOCKED_TERMS_REFRESH_INTERVAL_MS:-30000}
      BLOCKED_TERMS_FETCH_TIMEOUT_MS: ${BLOCKED_TERMS_FETCH_TIMEOUT_MS:-2000}
      BLOCKED_TERMS_MAX_STALE_SECONDS: ${BLOCKED_TERMS_MAX_STALE_SECONDS:-900}
      POLICY_DISTRIBUTION_INTERNAL_TOKEN: ${POLICY_DISTRIBUTION_INTERNAL_TOKEN:-}
      POLICY_DISTRIBUTION_ALLOW_UNAUTHENTICATED: ${POLICY_DISTRIBUTION_ALLOW_UNAUTHENTICATED:-false}
      POLICY_DISTRIBUTION_ALLOW_INSECURE_HTTP: ${POLICY_DISTRIBUTION_ALLOW_INSECURE_HTTP:-false}
      RESTRICTED_POLITICAL_ENTITIES_FILE: /app/config/restricted_political_entities.txt
      MODERATION_INTERNAL_RESPONSE_TOKEN: ${MODERATION_INTERNAL_RESPONSE_TOKEN:-}
      AI_WORK_IDEMPOTENCY_INTERNAL_TOKEN: ${AI_WORK_IDEMPOTENCY_INTERNAL_TOKEN:-}
      AI_WORK_IDEMPOTENCY_ALLOW_UNAUTHENTICATED: ${AI_WORK_IDEMPOTENCY_ALLOW_UNAUTHENTICATED:-false}
    volumes:
      - ./config:/app/config:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8000"
    depends_on:
      ai-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    cpus: "${GATEWAY_CPUS:-1.5}"
    mem_limit: "${GATEWAY_MEMORY_LIMIT:-1g}"
    pids_limit: ${GATEWAY_PIDS_LIMIT:-256}

  media-service:
    build:
      context: .
      dockerfile: services/media/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://moderation-db:5432/${POSTGRES_DB:-moderation}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-moderation}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-moderation-local}
      PDQ_DISTANCE_THRESHOLD: ${PDQ_DISTANCE_THRESHOLD:-31}
      PDQ_QUALITY_THRESHOLD: ${PDQ_QUALITY_THRESHOLD:-49}
      PDQ_CANDIDATE_LIMIT: ${PDQ_CANDIDATE_LIMIT:-5}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-8388608}
      MAX_IMAGE_REQUEST_BYTES: ${MAX_IMAGE_REQUEST_BYTES:-9437184}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-16777216}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-aze+eng+rus+tur}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-10}
      OCR_MAX_TEXT_CHARS: ${OCR_MAX_TEXT_CHARS:-20000}
      OCR_MAX_SPANS: ${OCR_MAX_SPANS:-256}
      OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-45.0}
      OCR_MAX_CONCURRENT: ${OCR_MAX_CONCURRENT:-2}
      MEDIA_ANALYSIS_MAX_CONCURRENT: ${MEDIA_ANALYSIS_MAX_CONCURRENT:-4}
      MEDIA_PDQ_MAX_CONCURRENT: ${MEDIA_PDQ_MAX_CONCURRENT:-2}
      MEDIA_ACQUIRE_TIMEOUT_MILLIS: ${MEDIA_ACQUIRE_TIMEOUT_MILLIS:-30000}
      MEDIA_RESULT_CACHE_MAX_ENTRIES: ${MEDIA_RESULT_CACHE_MAX_ENTRIES:-512}
      MEDIA_RESULT_CACHE_TTL_SECONDS: ${MEDIA_RESULT_CACHE_TTL_SECONDS:-3600}
      AI_WORK_IDEMPOTENCY_CLEANUP_ENABLED: ${AI_WORK_IDEMPOTENCY_CLEANUP_ENABLED:-true}
      AI_WORK_IDEMPOTENCY_CLEANUP_INTERVAL_MILLIS: ${AI_WORK_IDEMPOTENCY_CLEANUP_INTERVAL_MILLIS:-300000}
      AI_WORK_IDEMPOTENCY_CLEANUP_BATCH_SIZE: ${AI_WORK_IDEMPOTENCY_CLEANUP_BATCH_SIZE:-500}
      AI_WORK_IDEMPOTENCY_STALE_IN_PROGRESS_SECONDS: ${AI_WORK_IDEMPOTENCY_STALE_IN_PROGRESS_SECONDS:-86400}
      AI_WORK_IDEMPOTENCY_INTERNAL_TOKEN: ${AI_WORK_IDEMPOTENCY_INTERNAL_TOKEN:-}
      AI_WORK_IDEMPOTENCY_ALLOW_UNAUTHENTICATED: ${AI_WORK_IDEMPOTENCY_ALLOW_UNAUTHENTICATED:-false}
      POLICY_DISTRIBUTION_INTERNAL_TOKEN: ${POLICY_DISTRIBUTION_INTERNAL_TOKEN:-}
      POLICY_DISTRIBUTION_ALLOW_UNAUTHENTICATED: ${POLICY_DISTRIBUTION_ALLOW_UNAUTHENTICATED:-false}
      VISUAL_RETRIEVAL_URL: http://visual-retrieval:8000
      VISUAL_RETRIEVAL_INTERNAL_TOKEN: ${VISUAL_RETRIEVAL_INTERNAL_TOKEN:-}
      VISUAL_RETRIEVAL_ALLOW_UNAUTHENTICATED: ${VISUAL_RETRIEVAL_ALLOW_UNAUTHENTICATED:-true}
      VISUAL_DESCRIPTOR_VERSION: ${VISUAL_DESCRIPTOR_VERSION:-opencv-orb-4.12-v1}
      VISUAL_CANDIDATE_SELECTION_VERSION: ${VISUAL_CANDIDATE_SELECTION_VERSION:-orb-homography-specificity-v1}
      VISUAL_CANDIDATE_LIMIT: ${VISUAL_CANDIDATE_LIMIT:-5}
      VISUAL_CONNECT_TIMEOUT_MILLIS: ${VISUAL_CONNECT_TIMEOUT_MILLIS:-500}
      VISUAL_READ_TIMEOUT_MILLIS: ${VISUAL_READ_TIMEOUT_MILLIS:-30000}
      VISUAL_MAX_REFERENCES: ${VISUAL_MAX_REFERENCES:-256}
      VISUAL_MAX_SNAPSHOT_BYTES: ${VISUAL_MAX_SNAPSHOT_BYTES:-67108864}
    depends_on:
      moderation-db:
        condition: service_healthy
      visual-retrieval:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    cpus: "${MEDIA_CPUS:-2.0}"
    mem_limit: "${MEDIA_MEMORY_LIMIT:-3g}"
    pids_limit: ${MEDIA_PIDS_LIMIT:-512}

  visual-retrieval:
    build:
      context: ./services/visual-retrieval
      dockerfile: Dockerfile
    environment:
      VISUAL_RETRIEVAL_INTERNAL_TOKEN: ${VISUAL_RETRIEVAL_INTERNAL_TOKEN:-}
      VISUAL_RETRIEVAL_ALLOW_UNAUTHENTICATED: ${VISUAL_RETRIEVAL_ALLOW_UNAUTHENTICATED:-true}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    cpus: "${VISUAL_CPUS:-2.0}"
    mem_limit: "${VISUAL_MEMORY_LIMIT:-2g}"
    pids_limit: ${VISUAL_PIDS_LIMIT:-256}

  ai-service:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODERATION_MODEL: ${OPENAI_MODERATION_MODEL:-omni-moderation-2024-09-26}
      OPENAI_CUSTOM_MODEL: ${OPENAI_CUSTOM_MODEL:-gpt-5.4-mini}
      OPENAI_ADJUDICATION_MODEL: ${OPENAI_ADJUDICATION_MODEL:-gpt-5.6-terra}
      OPENAI_ADJUDICATION_REASONING_EFFORT: ${OPENAI_ADJUDICATION_REASONING_EFFORT:-medium}
      OPENAI_SERVICE_TIER: ${OPENAI_SERVICE_TIER:-default}
      OPENAI_CLASSIFICATION_IMAGE_DETAIL: ${OPENAI_CLASSIFICATION_IMAGE_DETAIL:-high}
      OPENAI_ADJUDICATION_IMAGE_DETAIL: ${OPENAI_ADJUDICATION_IMAGE_DETAIL:-original}
      OPENAI_PROMPT_CACHE_KEY_ENABLED: ${OPENAI_PROMPT_CACHE_KEY_ENABLED:-true}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      OPENAI_MAX_CONNECTIONS: ${OPENAI_MAX_CONNECTIONS:-32}
      OPENAI_MAX_CONNECTIONS_PER_ROUTE: ${OPENAI_MAX_CONNECTIONS_PER_ROUTE:-32}
      OPENAI_CONNECTION_REQUEST_TIMEOUT_MILLIS: ${OPENAI_CONNECTION_REQUEST_TIMEOUT_MILLIS:-500}
      OPENAI_IDLE_CONNECTION_EVICT_SECONDS: ${OPENAI_IDLE_CONNECTION_EVICT_SECONDS:-30}
      OPENAI_MAX_CONCURRENT_REQUESTS: ${OPENAI_MAX_CONCURRENT_REQUESTS:-32}
      OPENAI_MAX_CONCURRENT_REQUESTS_PER_MODEL: ${OPENAI_MAX_CONCURRENT_REQUESTS_PER_MODEL:-16}
      OPENAI_MAX_QUEUED_REQUESTS: ${OPENAI_MAX_QUEUED_REQUESTS:-64}
      OPENAI_ADMISSION_TIMEOUT_MILLIS: ${OPENAI_ADMISSION_TIMEOUT_MILLIS:-250}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-8388608}
      MAX_IMAGE_REQUEST_BYTES: ${MAX_IMAGE_REQUEST_BYTES:-9437184}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    cpus: "${AI_CPUS:-1.5}"
    mem_limit: "${AI_MEMORY_LIMIT:-2g}"
    pids_limit: ${AI_PIDS_LIMIT:-256}

  fake-openai:
    profiles: ["performance"]
    build:
      context: ./tests/performance/fake-openai
      dockerfile: Dockerfile
    environment:
      FAKE_OPENAI_DELAY_MS: ${FAKE_OPENAI_DELAY_MS:-50}
      FAKE_OPENAI_ERROR_EVERY: ${FAKE_OPENAI_ERROR_EVERY:-0}
      FAKE_OPENAI_ERROR_STATUS: ${FAKE_OPENAI_ERROR_STATUS:-429}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
        ]
      interval: 2s
      timeout: 2s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "${FAKE_OPENAI_CPUS:-1.0}"
    mem_limit: "${FAKE_OPENAI_MEMORY_LIMIT:-256m}"
    pids_limit: ${FAKE_OPENAI_PIDS_LIMIT:-128}

  k6:
    profiles: ["load"]
    image: grafana/k6:0.57.0
    restart: "no"
    command: ["run", "/scripts/moderation.js"]
    environment:
      BASE_URL: http://gateway:8000
      WORKLOAD: ${PERF_WORKLOAD:-mixed}
      RATE: ${PERF_RATE:-10}
      DURATION: ${PERF_DURATION:-2m}
      PRE_ALLOCATED_VUS: ${PERF_PRE_ALLOCATED_VUS:-50}
      MAX_VUS: ${PERF_MAX_VUS:-100}
      REQUEST_TIMEOUT: ${PERF_REQUEST_TIMEOUT:-75s}
      P95_THRESHOLD: ${PERF_P95_THRESHOLD:-p(95)<5000}
    volumes:
      - ./tests/performance:/scripts:ro
    depends_on:
      gateway:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "${K6_CPUS:-1.0}"
    mem_limit: "${K6_MEMORY_LIMIT:-512m}"
    pids_limit: ${K6_PIDS_LIMIT:-256}

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - moderation-prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "${PROMETHEUS_CPUS:-0.5}"
    mem_limit: "${PROMETHEUS_MEMORY_LIMIT:-512m}"
    pids_limit: ${PROMETHEUS_PIDS_LIMIT:-128}

volumes:
  moderation-db-data:
  moderation-prometheus-data:
