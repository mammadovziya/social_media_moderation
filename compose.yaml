name: social-media-moderation

services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      OPENAI_TERRA_REASONING_EFFORT: ${OPENAI_TERRA_REASONING_EFFORT:-medium}
      OPENAI_MAX_CONCURRENT_REQUESTS: ${OPENAI_MAX_CONCURRENT_REQUESTS:-4}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-8388608}
      MAX_IMAGE_REQUEST_BYTES: ${MAX_IMAGE_REQUEST_BYTES:-9437184}
      MAX_IMAGE_WIDTH: ${MAX_IMAGE_WIDTH:-8192}
      MAX_IMAGE_HEIGHT: ${MAX_IMAGE_HEIGHT:-8192}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      EXACT_SHA256_REFERENCES_PATH: file:/app/config/exact_sha256_references.txt
      MODERATION_TERMS_PATH: file:/app/config/moderation_terms.txt
      MODERATION_POLICY_VERSION: ${MODERATION_POLICY_VERSION:-minimal-sha-ai-v1}
    volumes:
      - ./config/exact_sha256_references.txt:/app/config/exact_sha256_references.txt:ro
      - ./config/moderation_terms.txt:/app/config/moderation_terms.txt:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
